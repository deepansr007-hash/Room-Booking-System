<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Aura Grand Luxury Hotels</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-gem"></i>
        <span>AURA GRAND</span>
      </a>
      <div id="nav-auth-container" class="nav-auth"></div>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your bespoke reservations and member privileges</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="login-email" class="form-input" placeholder="e.g. sophia@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn btn-gold" style="width:100%;margin-top:1rem;height:48px;">
          <i class="fa-solid fa-key"></i> Authenticate & Enter
        </button>
      </form>

      <!-- Instant Demo Credential Autofillers -->
      <div class="demo-credentials-box">
        <div style="font-weight:700;margin-bottom:0.4rem;color:#fff;">
          <i class="fa-solid fa-bolt" style="color:var(--accent-gold);"></i> Quick Test Credentials:
        </div>
        <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
          <button type="button" onclick="fillGuestDemo()" class="btn btn-outline btn-sm" style="flex:1;">
            Guest Demo
          </button>
          <button type="button" onclick="fillAdminDemo()" class="btn btn-outline btn-sm" style="flex:1;">
            Admin Demo
          </button>
        </div>
      </div>

      <div style="text-align:center;margin-top:1.8rem;font-size:0.9rem;color:var(--text-muted);">
        Don't have an account yet? 
        <a href="register.html" style="color:var(--accent-gold);font-weight:600;">Join Aura Grand</a>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    function fillGuestDemo() {
      document.getElementById("login-email").value = "sophia@example.com";
      document.getElementById("login-password").value = "password123";
      showToast("Guest credentials autofilled.", "info");
    }

    function fillAdminDemo() {
      document.getElementById("login-email").value = "admin@grandazure.com";
      document.getElementById("login-password").value = "admin123";
      showToast("Admin credentials autofilled.", "info");
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const btn = document.getElementById("btn-login");

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

      try {
        const res = await apiRequest("/auth/login", "POST", { email, password });
        if (res.success && res.token) {
          Auth.setAuth(res.token, res.user);
          showToast(`Welcome back, ${res.user.name}!`, "success");
          setTimeout(() => {
            const redirectUrl = new URLSearchParams(window.location.search).get("redirect") || "hotels.html";
            window.location.href = redirectUrl;
          }, 800);
        }
      } catch (err) {
        // Fallback for demo if backend offline
        if (email === "sophia@example.com" && password === "password123") {
          Auth.setAuth("mock_jwt_token_guest", {
            id: "usr_guest_002",
            name: "Sophia Reynolds",
            email: "sophia@example.com",
            role: "guest"
          });
          showToast("Signed in in preview mode.", "success");
          setTimeout(() => { window.location.href = "hotels.html"; }, 800);
          return;
        } else if (email === "admin@grandazure.com" && password === "admin123") {
          Auth.setAuth("mock_jwt_token_admin", {
            id: "usr_admin_001",
            name: "Alexander Wright",
            email: "admin@grandazure.com",
            role: "admin"
          });
          showToast("Signed in as Admin in preview mode.", "success");
          setTimeout(() => { window.location.href = "hotels.html"; }, 800);
          return;
        }
        showToast(err.message || "Invalid email or password.", "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-key"></i> Authenticate & Enter`;
      }
    }
  </script>
</body>
</html>
